services:
  bhs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: black_hole_share
    restart: unless-stopped
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro

    environment:
      - TZ=Europe/Rome
    tty: true
    stdin_open: true
    ports:
      - "8080:8080"
      # HTTPS, used only when it is enabled in the admin panel.
      - "8443:8443"
