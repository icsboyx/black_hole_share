services:
  bhs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: black_hole_share
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro

    environment:
      - TZ=Europe/Rome
      - BIND_ADDR=0.0.0.0
      - BIND_PORT=8080
    tty: true
    stdin_open: true
    ports:
      - "8080:8080"
