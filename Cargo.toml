[package]
name = "black_hole_share"
version = "1.3.0"
edition = "2024"

[dependencies]
actix-web = "4.18.1"
actix-files = "0.7"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
argon2 = "0.6.0"
anyhow = "1.0.104"
chrono = "0.4"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = [
    "fs",
    "macros",
    "rt-multi-thread",
    "signal",
    "time",
] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
base64 = "0.23.1"
mime_guess = "2.0.5"
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
hkdf = "0.13"
sha2 = "0.11"
getrandom = "0.4"
zeroize = "1.9"
