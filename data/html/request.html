<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Black Hole Share - Send files</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="/nav.js" defer></script>
  <style>
    .request-card {
      margin: 40px auto 0 auto;
      width: 100%;
      max-width: 560px;
      background-color: var(--bg-secondary);
      border: 1px solid rgba(51, 204, 255, 0.35);
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    .request-head {
      padding: 24px 26px 18px 26px;
    }

    .request-head h2 {
      color: var(--text-primary);
      font-size: 1.15em;
      margin: 0;
      overflow-wrap: anywhere;
    }

    .request-text {
      color: var(--text-secondary);
      font-size: 0.9em;
      margin: 10px 0 0 0;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .request-facts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      background-color: rgba(89, 89, 89, 0.5);
      border-top: 1px solid rgba(89, 89, 89, 0.5);
      border-bottom: 1px solid rgba(89, 89, 89, 0.5);
    }

    .fact {
      background-color: var(--bg-secondary);
      padding: 12px 18px;
      min-width: 0;
    }

    .fact-label {
      color: var(--text-secondary);
      font-size: 0.7em;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .fact-value {
      color: var(--accent-cyan);
      font-size: 0.9em;
      margin-top: 4px;
      overflow-wrap: anywhere;
    }

    .request-body {
      display: grid;
      gap: 14px;
      padding: 20px 26px 24px 26px;
    }

    .request-body .dropzone {
      margin: 0;
    }

    .send-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background-color: var(--accent-cyan);
      color: var(--bg-tertiary);
      cursor: pointer;
      font-family: inherit;
      font-size: 1em;
      font-weight: bold;
      transition: background-color 0.2s ease;
    }

    .send-btn:hover:not(:disabled) {
      background-color: var(--accent-green);
    }

    .send-btn:disabled {
      background-color: var(--inactive-gray);
      color: var(--text-secondary);
      cursor: default;
    }

    .queue {
      display: grid;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .queue li {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 8px 10px;
      background-color: var(--bg-primary);
      border: 1px solid rgba(89, 89, 89, 0.6);
      border-radius: 8px;
      font-size: 0.85em;
    }

    .queue .queue-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .queue .queue-state {
      color: var(--text-secondary);
      text-align: right;
    }

    .queue .done {
      color: var(--accent-green);
    }

    .queue .failed {
      color: #ff6666;
    }

    .request-line {
      min-height: 1.2em;
      margin: 0;
      font-size: 0.85em;
      text-align: center;
    }

    .request-missing {
      padding: 40px 26px;
      text-align: center;
      color: var(--text-secondary);
    }

    .request-missing h2 {
      color: var(--accent-cyan);
      margin: 0 0 8px 0;
      font-size: 1.1em;
    }

    @media (max-width: 560px) {
      .request-facts {
        grid-template-columns: minmax(0, 1fr);
      }
    }
  </style>
</head>

<body class="view-page">
  <main class="page-scroll">
    <div class="page-column">
      <h1><a href="/" class="home-link">Black Hole Share</a></h1>
      <div id="requestCard" class="request-card">
        <div class="request-missing">Loading...</div>
      </div>
    </div>
  </main>

  {{FOOTER}}

  <script>
    const requestId = window.location.pathname.split("/").pop();
    const card = document.getElementById("requestCard");
    let info = null;
    // Files chosen by the uploader: { index, file, state: ready|sending|done|failed, error, percent }.
    let queue = [];
    let uploading = false;
    let nextIndex = 0;

    // Builds DOM nodes; strings become text nodes, so nothing typed by others is parsed as HTML.
    function el(tag, props = {}, ...children) {
      const node = document.createElement(tag);
      Object.assign(node, props);
      for (const child of children) {
        node.append(child instanceof Node ? child : document.createTextNode(String(child)));
      }
      return node;
    }

    function formatBytes(bytes) {
      if (bytes === 0) return "0 B";
      const units = ["B", "KB", "MB", "GB", "TB"];
      const i = Math.min(units.length - 1, Math.floor(Math.log(bytes) / Math.log(1024)));
      return `${parseFloat((bytes / Math.pow(1024, i)).toFixed(2))} ${units[i]}`;
    }

    function showMissing(title, text) {
      card.replaceChildren(el("div", { className: "request-missing" }, el("h2", {}, title), text));
    }

    function extensionOf(name) {
      const dot = name.lastIndexOf(".");
      return dot > 0 ? name.slice(dot + 1).toLowerCase() : "";
    }

    // The same checks as the server, so a wrong file is reported before it is sent.
    function problemWith(file) {
      if (info.extensions.length > 0 && !info.extensions.includes(extensionOf(file.name))) {
        return `Not accepted: allowed types are ${info.extensions.join(", ")}`;
      }
      if (file.size > info.max_file_size_bytes) {
        return `Too large: at most ${formatBytes(info.max_file_size_bytes)}`;
      }
      return null;
    }

    function sentCount() {
      return queue.filter((entry) => entry.state === "done").length;
    }

    // Files the link still accepts, counting the ones sent from this page.
    function filesLeft() {
      return info.files_left === null ? Infinity : info.files_left - sentCount();
    }

    function stateText(entry) {
      if (entry.state === "done") return "Sent";
      if (entry.state === "sending") return `${entry.percent}%`;
      if (entry.state === "failed") return entry.error;
      return "Ready";
    }

    function render() {
      const left = filesLeft();
      if (left <= 0 && sentCount() === 0) {
        showMissing("This link is closed", "It has already received all the files it accepts.");
        return;
      }
      // Kept across redraws.
      const typedName = document.getElementById("uploaderName")?.value || "";
      const line = document.getElementById("requestLine");
      const lineState = line ? [line.textContent, line.className] : ["", "request-line message"];

      const facts = [
        ["Largest file", formatBytes(info.max_file_size_bytes)],
        ["File types", info.extensions.length > 0 ? info.extensions.join(", ") : "Any"],
        ["Files left", info.files_left === null ? "No limit" : Math.max(0, left)],
      ];

      const nameInput = el("input", {
        id: "uploaderName",
        type: "text",
        maxLength: 100,
        autocomplete: "name",
        placeholder: info.require_name ? "Required" : "Optional",
        value: typedName,
        disabled: uploading,
      });
      const body = [
        el(
          "div",
          { className: "field" },
          el("label", { className: "field-label", htmlFor: "uploaderName" }, "Your name"),
          el("div", { className: "input-wrap" }, nameInput)
        ),
      ];

      if (left > 0) {
        const fileInput = el("input", { id: "fileInput", type: "file", multiple: left > 1, hidden: true });
        if (info.extensions.length > 0) {
          fileInput.accept = info.extensions.map((ext) => `.${ext}`).join(",");
        }
        fileInput.addEventListener("change", () => {
          addFiles(fileInput.files);
          fileInput.value = "";
        });
        const dropzone = el(
          "label",
          { className: "dropzone", htmlFor: "fileInput" },
          el("strong", {}, left > 1 ? "Drop files here or click to choose" : "Drop a file here or click to choose"),
          el("small", {}, "Sent encrypted: only the person who asked can open them"),
          fileInput
        );
        dropzone.addEventListener("dragover", (event) => {
          event.preventDefault();
          dropzone.classList.add("over");
        });
        dropzone.addEventListener("dragleave", () => dropzone.classList.remove("over"));
        dropzone.addEventListener("drop", (event) => {
          event.preventDefault();
          dropzone.classList.remove("over");
          addFiles(event.dataTransfer.files);
        });
        body.push(dropzone);
      }

      if (queue.length > 0) {
        const items = queue.map((entry) => {
          let className = "queue-state";
          if (entry.state === "done") className += " done";
          if (entry.state === "failed") className += " failed";
          return el(
            "li",
            {},
            el("span", { className: "queue-name", title: entry.file.name }, `${entry.file.name} · ${formatBytes(entry.file.size)}`),
            el("span", { className, id: `state-${entry.index}` }, stateText(entry))
          );
        });
        body.push(el("ul", { className: "queue" }, ...items));
      }

      if (left > 0) {
        const ready = queue.some((entry) => entry.state === "ready");
        const sendBtn = el("button", { className: "send-btn", type: "button", disabled: uploading || !ready }, "Send");
        sendBtn.addEventListener("click", sendAll);
        body.push(sendBtn);
      }
      body.push(el("p", { className: lineState[1], id: "requestLine" }, lineState[0]));

      const head = [el("h2", {}, info.title)];
      if (info.message) head.push(el("p", { className: "request-text" }, info.message));
      card.replaceChildren(
        el("div", { className: "request-head" }, ...head),
        el(
          "div",
          { className: "request-facts" },
          ...facts.map(([label, value]) =>
            el("div", { className: "fact" }, el("div", { className: "fact-label" }, label), el("div", { className: "fact-value" }, value))
          )
        ),
        el("div", { className: "request-body" }, ...body)
      );
    }

    function setLine(text, kind = "error") {
      const line = document.getElementById("requestLine");
      if (!line) return;
      line.textContent = text;
      line.className = `request-line message ${kind}`;
    }

    function addFiles(files) {
      if (uploading) return;
      // Files already sent stay listed; the others are replaced by the new choice.
      queue = queue.filter((entry) => entry.state === "done");
      for (const file of files) {
        const problem = problemWith(file);
        queue.push({ index: nextIndex++, file, state: problem ? "failed" : "ready", error: problem, percent: 0 });
      }
      const ready = queue.filter((entry) => entry.state === "ready");
      for (const entry of ready.slice(Math.max(0, filesLeft()))) {
        entry.state = "failed";
        entry.error = "More files than this link accepts";
      }
      setLine("");
      render();
    }

    // Sends one file; resolves with null on success or with an error text.
    function sendOne(entry, uploader) {
      return new Promise((resolve) => {
        const query = new URLSearchParams({ name: entry.file.name });
        if (uploader) query.set("uploader", uploader);
        const request = new XMLHttpRequest();
        request.upload.addEventListener("progress", (progress) => {
          if (!progress.lengthComputable) return;
          entry.percent = Math.floor((progress.loaded / progress.total) * 100);
          const state = document.getElementById(`state-${entry.index}`);
          if (state) state.textContent = `${entry.percent}%`;
        });
        request.addEventListener("loadend", () => {
          if (request.status === 201) {
            resolve(null);
            return;
          }
          let data = null;
          try {
            data = JSON.parse(request.responseText);
          } catch {
            // Not JSON: a lost connection or a proxy error page.
          }
          resolve((data && data.error) || (request.status === 0 ? "Connection lost" : `Failed (HTTP ${request.status})`));
        });
        request.open("POST", `/api/requests/${encodeURIComponent(requestId)}/files?${query}`);
        request.send(entry.file);
      });
    }

    async function sendAll() {
      const uploader = document.getElementById("uploaderName").value.trim();
      if (info.require_name && !uploader) {
        setLine("Enter your name.");
        document.getElementById("uploaderName").focus();
        return;
      }
      uploading = true;
      setLine("");
      for (const entry of queue.filter((item) => item.state === "ready")) {
        entry.state = "sending";
        render();
        const error = await sendOne(entry, uploader);
        entry.state = error ? "failed" : "done";
        entry.error = error;
      }
      uploading = false;
      render();
      const failed = queue.filter((entry) => entry.state === "failed").length;
      if (failed > 0) {
        setLine(`${failed} file(s) not sent.`);
      } else {
        setLine(`Sent ${sentCount()} file(s). Thank you!`, "ok");
      }
    }

    async function load() {
      try {
        const response = await fetch(`/api/requests/${encodeURIComponent(requestId)}`, { cache: "no-store" });
        if (!response.ok) {
          showMissing("This link is not valid", "It may have been closed. Ask the person who sent it for a new one.");
          return;
        }
        info = await response.json();
        render();
      } catch {
        showMissing("Cannot reach the server", "Try again in a moment.");
      }
    }

    load();
  </script>
</body>

</html>
